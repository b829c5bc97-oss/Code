[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "0.1.0"
description = "AI Digital Operating System - an autonomous goal-execution kernel"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
# The kernel is deliberately zero-dependency: it must boot on any machine that
# has a CPython interpreter. Everything else is an optional adapter.
dependencies = []

[project.optional-dependencies]
anthropic = []           # uses stdlib urllib; key via ANTHROPIC_API_KEY
browser = ["playwright>=1.44"]
data = ["pandas>=2.0", "openpyxl>=3.1"]
server = ["uvicorn>=0.30", "fastapi>=0.111"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
aios = "aios.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["aios*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 104
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # function calls in defaults are used deliberately for factories
    "RUF012",  # tool contracts are declarative class-level dicts by design
    "RUF001",  # box-drawing and status glyphs in user-facing strings are intentional
    "UP042",   # str-mixin enums stay for json round-tripping compatibility
    "SIM105",  # explicit try/except carries the "why we ignore this" comment
    "SIM108",  # ternaries hurt readability in the branches flagged here
    "SIM905",  # whitespace-split word lists stay readable as prose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# These modules embed literal output - scaffold templates, CSS/JS, and credential
# regexes. Wrapping those lines would change generated files or hurt readability.
"aios/tools/builtin/code.py" = ["E501"]
"aios/tools/builtin/docs.py" = ["E501"]
"aios/foundation/redaction.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
