[build]
  publish = "public"
  command = "echo 'Social HQ: no build step'"

[functions]
  node_bundler = "esbuild"

# The single-page app handles its own routes after the #.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
